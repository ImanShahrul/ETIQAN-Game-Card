<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etiqa Logo</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .logo {
      position: relative;
      display: inline-block;
      font-size: 100px;
      font-weight: 700;
      color: black;
      line-height: 1;
      letter-spacing: -5px;
    }

    .smile {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: -30px;

      width: 100px;
      height: 45px;

      border-bottom: 10px solid #ffbd00;
      border-radius: 0 0 100px 100px;
    }
  </style>
</head>

<body>

  <div class="logo">
    eTiQa
    <div class="smile"></div>
  </div>

</body>
</html>
